name: verificar

# EL HOOK SOLO CORRE EN UNA MÁQUINA Y SOLO SI NO SE SALTA.
# Esto corre siempre, y es lo que de verdad protege `main`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene sentido
# gastar minutos verificando un commit que ya está superado.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: lints · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # POR QUÉ UN CONTENEDOR Y NO UNA RAMA DE NEON:
      #   · base VACÍA y exclusiva en cada ejecución — dos PR simultáneos no
      #     comparten estado, que es de donde salen los fallos intermitentes;
      #   · sin secreto que gestionar, y este repositorio es PÚBLICO;
      #   · CI no se pone rojo cuando Neon tiene una incidencia.
      # La versión se fija en 18 para igualar el 18.6 de Neon. Las tres
      # extensiones (citext, pg_trgm, unaccent) vienen en el contrib de la
      # imagen oficial.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anime_vault_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # ── EL PROXY HTTP DE NEON ───────────────────────────────────────────
      #
      # La APLICACIÓN habla con la base por el driver HTTP de Neon
      # (`src/lib/db/interno.ts`), que hace POST a `https://<host>/sql`. Un
      # Postgres normal no tiene ese endpoint, así que TODO test que ejercite
      # código real de la app contra la base fallaba aquí: los de integración
      # con diez errores `NeonHttpPreparedQuery`, y el del camino real de la
      # peor forma posible —su worker moría y el informe decía «57 passes ·
      # 57 total» cuando los ficheros eran 58—.
      #
      # Este proxy traduce: protocolo HTTP de Neon por delante, Postgres por
      # detrás. Se eligió frente a la alternativa —que `dbInterna()` cambiara
      # a `pg` cuando el destino no es Neon— porque así CI ejecuta EL MISMO
      # driver que producción. Cambiar de driver habría dejado los tests
      # verificando una variante, y `batch()` no tiene equivalente fiel en
      # `pg`: las consultas de drizzle vienen atadas a su cliente, meterlas en
      # un `transaction()` no las reata, y se perdería la atomicidad justo en
      # la capa donde importa.
      #
      # FIJADO POR DIGEST, no por `:main`. Es una imagen de terceros dentro de
      # un repositorio público: con etiqueta móvil, quien controle ese registro
      # decide qué corre aquí. Con digest, actualizarla es un commit visible.
      # Solo vive dentro del runner, no toca producción ni el artefacto que se
      # despliega.
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/anime_vault_ci
        ports:
          - 4444:4444

    env:
      # Sin credencial real: el contenedor es local al runner y muere con él.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anime_vault_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/anime_vault_ci
      # Un valor cualquiera: no se firma nada real, pero el arranque lo exige.
      AUTH_SECRET: secreto-solo-para-ci-no-firma-nada-real
      # Los tests de rate limiting necesitan el limitador ENCENDIDO.
      RATE_LIMIT_ENABLED: "true"
      # Auth.js v5 con NODE_ENV=production RECHAZA toda peticion si no sabe en
      # que host vive: sin `AUTH_URL` ni esta bandera responde UntrustedHost a
      # todo, incluido `/api/auth/csrf`. El test del camino real arranca el
      # servidor de PRODUCCION, asi que le pasaba justo eso: sondeaba 120 veces,
      # agotaba sus 60 segundos y se caia sin decir por que.
      #
      # Se usa la bandera y no `AUTH_URL` porque ese test levanta DOS servidores
      # en puertos distintos, y una URL fija solo valdria para uno.
      #
      # En produccion no hace falta: Vercel define VERCEL=1 y Auth.js ya confia.
      AUTH_TRUST_HOST: "true"
      # Manda el driver HTTP de Neon al proxy de aquí arriba en vez de a
      # `https://<host>/sql`. En producción esta variable NO existe, y sin ella
      # `src/lib/db/motor.ts` deja el endpoint de siempre.
      NEON_HTTP_PROXY: http://localhost:4444/sql

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` respeta el lockfile al pie de la letra: si package.json y el
      # lock discrepan, falla en vez de "arreglarlo" en silencio.
      - name: Instalar dependencias
        run: npm ci

      # ── Lo barato primero: falla pronto y ahorra minutos ──────────────────
      - name: Scripts declarados (que no haya fantasmas)
        run: npm run lint:scripts

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tokens de diseño (ningún hex fuera de globals.css)
        run: npm run lint:tokens

      # Una receta de clases escrita dos veces acaba siendo dos recetas
      # distintas. Falla si el número SUBE, no si hay duplicados.
      - name: Recetas de clases duplicadas
        run: npm run lint:duplicados

      # Un {...spread} detrás de lo que el componente calcula lo pisa ENTERO, y
      # no lo ve ningún test que no renderice. Ver code-style.md.
      - name: Spreads de props por detrás
        run: npm run lint:spread

      # Intenta saltarse el contrato de datos y exige que todos los intentos
      # sean rechazados. Ver src/lib/db/contexto.ts.
      - name: Contrato de datos (intentos de salto)
        run: npm run lint:contrato

      - name: Formato
        run: npm run format:check

      # ── Base de datos, ANTES DE NINGÚN TEST ───────────────────────────────
      #
      # EL ORDEN NO ES COSMÉTICO, Y ESTUVO MAL DESDE EL PRIMER DÍA.
      #
      # `test:unit` se llama «unitarios» y lo son casi todos, pero uno no:
      # `src/lib/auth/revocacion.camino-real.test.ts` arranca la aplicación de
      # verdad y hace login contra Postgres —es el test del CAMINO REAL, y esa
      # es exactamente su razón de existir—. Sólo se salta si
      # `DATABASE_URL_UNPOOLED` no está definida, y en CI SÍ lo está.
      #
      # Con las migraciones detrás, ese test corría contra una base sin tablas
      # y fallaba siempre. Resultado: **el workflow nunca pasó**, ni una vez en
      # sus veinte primeras ejecuciones, y el badge del README llevaba rojo
      # desde que se creó.
      #
      # Eso no es un detalle de configuración: `.githooks/pre-commit` justifica
      # lo que NO comprueba diciendo «lo cubre .github/workflows/verificar.yml,
      # que corre en cada push y no se puede saltar». Un guardián que falla
      # siempre no se lee, y uno que no se lee no guarda nada — es la misma
      # lección del hook de 30 segundos, un escalón más arriba.
      #
      # 0000_extensiones.sql SE APLICA TAMBIÉN AQUÍ. Una base nueva —rama de
      # Neon o contenedor— nace sin extensiones, y la migración 0001 falla en
      # la primera columna `citext` de `users`.
      - name: Migraciones (incluye las extensiones)
        run: npm run db:migrate

      - name: Verificar el esquema aplicado
        run: npx tsx scripts/verificar-esquema.ts

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Tests unitarios
        run: npm run test:unit

      - name: Tests de integración (aislamiento entre usuarios)
        run: npm run test:integracion

      # ── Lo caro al final ──────────────────────────────────────────────────
      - name: Build de producción
        run: npm run build

      # ── EL CAMINO REAL, DESPUÉS DEL BUILD Y REUTILIZÁNDOLO ────────────────
      #
      # Este test arranca la aplicación de verdad. Estaba dentro de «Tests
      # unitarios» y ahí hacía su PROPIO `next build` dentro de un worker de
      # vitest: el paso tardaba 1m54s y el worker moría sin dejar mensaje,
      # arrastrando el paso entero con «Worker exited unexpectedly». Peor aún,
      # vitest no contaba ese fichero ni como pasa ni como falla, así que el
      # informe decía «57 passes · 57 total» cuando los ficheros eran 58.
      #
      # Aquí ya hay un `.next` recién construido, de ESTE commit y con ESTE
      # entorno, hecho por el paso de arriba. `CAMINO_REAL_REUSA_BUILD` le dice
      # al test que no vuelva a compilar.
      #
      # OJO CON ESO: el test compila por su cuenta A PROPÓSITO, porque
      # `next start` sirve lo que haya en `.next` y sin compilar se probaría
      # contra un build anterior —un verde sobre código que ya no existe—. La
      # bandera solo es segura porque este paso va inmediatamente después del
      # build, en el mismo job y el mismo commit. En local NO se pone, y el
      # test sigue compilando.
      - name: Camino real (sesión revocada, servidor de verdad)
        run: npm run test:camino-real
        env:
          CAMINO_REAL_REUSA_BUILD: "1"

  auditoria:
    name: dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falla por vulnerabilidades altas o críticas. Las moderadas se avisan
      # pero no bloquean: ver los `overrides` de package.json.
      - name: npm audit
        run: npm audit --audit-level=high
